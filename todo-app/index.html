<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>todo-app</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main >
        <div>
            <button id="addTaskBtn" class="addIconBtn">
                <img src="./public/icons/circle-plus.png" alt="Add icon" class="addIcon">
                Add task
            </button>
        </div>


        <!-- The modal -->
        <article data-testid="test-todo-card" id="todoModal" class="todoModal">
            <div class="modal-content">
                <span class="close">&times;</span>
                
                <div class="content">
                    <div class="">
                        <div class="task">
                            <input type="text" placeholder="Title:" class="input">
                        </div>
                        <div class="task">
                            <input type="text" placeholder="Description..." class="input">
                        </div>
                    </div>

                    <div class="ctrlbtns">
                        <div class="" data-testid="test-todo-priority">
                            <!-- <img src="./public/icons/file-exclamation-point.png" alt="priority" class="icon"> -->
                            <select name="priority" data-testid="test-todo-priority">
                                <option value="">Select Priority</option>
                                <option value="high"> High</option>
                                <option value="medium">Medium</option>
                                <option value="low">Low</option>
                            </select>
                        </div>
                        <button class="ctrlbtns" data-testid="test-todo-due-date">
                            <img src="./public/icons/calendar-days.png" alt="due data" class="icon">
                            <p data-testid="test-todo-due-date">Date</p>
                        </button>
                        <button class="ctrlbtns">
                            <img src="./public/icons/clock.png" alt="time icon" class="icon">
                            <p class="" data-testid="test-todo-time-remaining">Duration</p>
                        </button>
                    </div>
    
                </div>
            </div>

            <div class=""></div>
        </article>

        <!-- Created tasks-->
        <article>
            <div class="art" role="list">
                <input type="checkbox" data-testid="test-todo-complete-toggle">
                <div class="">
                    <h2 data-testid="test-todo-title">Wash the plate</h2>
                    <p data-testid="test-todo-description">Description of </p>
                </div>
                <div>
                    <p data-testid="test-todo-due-date">Due by Feb 18, 2026</p>
                    <time datetime="2017-04-29T19:00" data-testid="test-todo-time-remaining">19:00 </p>
                </div>
                <button data-testid="test-todo-status">
                    <img src="./public/icons/file-exclamation-point.png" alt="status" class="icon"/>
                    <p class="">Status</p>
                </button>
                <div>
                    <h3>category list</h3>
                </div>
                <button class="" data-testid="test-todo-edit-button">
                    <img src="./public/icons/square-pen.png" alt="Edit button" class="icon">
                    <p>Edit</p>
                </button>
                <button class="" data-testid="test-todo-edit-button">
                    <img src="./public/icons/trash.png" alt="Delete button" class="icon">
                    <p>Delete</p>
                </button>
            </div>
        </article>
        <article>
            <select name="category" id="" data-testid="test-todo-tags">
                <option value="">Select category</option>
                <option value="home">Home</option>
                <option value="work">Work</option>
                <option value="study">Study</option>
                <option value="finance">Finance</option>
                <option value="micelleneous">Micelleneous</option>
            </select>
            
        </article>

    </main>
    <script src="script.js" defer></script>
</body>
</html>
