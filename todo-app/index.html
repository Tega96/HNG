<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>todo-app</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main >
        <button id="addTaskBtn">Add task</button>

        <!-- The modal -->
        <article data-testid="test-todo-card" id="todoModal" class="todoModal">
            <div class="modal-content">
                <span class="close">&times;</span>
                
                <div class="content">
                    <div class="task">
                        <h2 class="title" data-testid="test-todo-title">Title:</h2>
                        <p class="description" data-testid="test-todo-description">description</p>
                    </div>
                    <div class="smaller">
                        <div class="" data-testid="test-todo-priority">
                            <img src="" alt="priority" class="icon">
                            <p>High</p>
                        </div>
                        <div class="" data-testid="test-todo-due-date">
                            <img src="" alt="due data" class="icon">
                            <p>Due in 3 days time</p>
                        </div>
                        <div class="">
                            <img src="" alt="time icon" class="icon">
                            <p class="">22: 23</p>
                        </div>
                    </div>
    
                </div>
            </div>

            <div class=""></div>
        </article>

    </main>
    <script src="script.js" defer></script>
</body>
</html>
